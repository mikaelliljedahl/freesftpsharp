# HAProxy in front of two FreeSftpSharp nodes (deploy/cluster/docker-compose.yml, docs/CLUSTER.md).
global
    log stdout format raw local0

defaults
    log global
    timeout connect 5s
    timeout client 1h      # SFTP sessions are long; the server has its own idle timeout
    timeout server 1h

# SFTP: TCP, with the PROXY protocol v2 so that the nodes see the client address (Proxy:AllowedSources).
# No sticky sessions: every SSH connection is complete on one node.
frontend sftp
    mode tcp
    bind :2222
    default_backend sftp_nodes

backend sftp_nodes
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check expect rstring ^SSH-2\.0-
    server node-a node-a:22 send-proxy-v2 check check-send-proxy inter 5s
    server node-b node-b:22 send-proxy-v2 check check-send-proxy inter 5s

# Admin UI and REST API: HTTP. The nodes share the data protection keys (DataProtection:Store=Database), so a login
# cookie and an API token work on both. The interactive Blazor UI (SignalR) must stay on the node of its circuit, so the
# browser gets a sticky cookie; the REST API needs none.
frontend admin
    mode http
    bind :8080
    option forwardfor
    default_backend admin_nodes

backend admin_nodes
    mode http
    balance roundrobin
    cookie FSS_NODE insert indirect nocache httponly
    option httpchk GET /Login
    server node-a node-a:80 check inter 5s cookie a
    server node-b node-b:80 check inter 5s cookie b
