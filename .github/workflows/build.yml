name: "Build and test"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }}${{ matrix.db && format(', {0}', matrix.db) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        # The settings database of the store and repository tests (FREESFTPSHARP_TEST_DB): SQLite in the main legs, and
        # the whole suite once more on Linux with PostgreSQL and with SQL Server (the service containers below).
        db: [ '' ]
        include:
          - os: ubuntu-latest
            db: PostgreSQL
          - os: ubuntu-latest
            db: SqlServer

    services:
      # The S3 tests (conformance suite and end-to-end) run against this MinIO on Linux and are skipped elsewhere.
      # Windows runners have no service containers: an empty image skips the service there.
      # The Bitnami image starts the MinIO server without a command (a service container cannot pass one).
      minio:
        image: ${{ matrix.os == 'ubuntu-latest' && 'bitnamilegacy/minio:2025.4.22' || '' }}
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: freesftpsharp
          MINIO_ROOT_PASSWORD: freesftpsharp-ci-only
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

      # The GCS tests (conformance suite and end-to-end) run against this fake-gcs-server on Linux and are skipped
      # elsewhere (an empty image skips the service on Windows). A service container cannot pass flags, so the
      # server is configured with its FAKE_GCS_* environment variables; the external URL is the URL of the tests.
      fake-gcs:
        image: ${{ matrix.os == 'ubuntu-latest' && 'fsouza/fake-gcs-server:1.56.1' || '' }}
        ports:
          - 4443:4443
        env:
          FAKE_GCS_SCHEME: http
          FAKE_GCS_BACKEND: memory
          FAKE_GCS_EXTERNAL_URL: http://127.0.0.1:4443

      # The LDAP tests (#64) run against this OpenLDAP directory on Linux and are skipped elsewhere (an empty image skips
      # the service on Windows). The image creates the users alice and bob and the group sftp-staff from its environment.
      openldap:
        image: ${{ matrix.os == 'ubuntu-latest' && 'bitnamilegacy/openldap:2.6.10' || '' }}
        ports:
          - 1389:1389
        env:
          LDAP_ROOT: dc=example,dc=org
          LDAP_ADMIN_USERNAME: admin
          LDAP_ADMIN_PASSWORD: adminpassword
          LDAP_USERS: alice,bob
          LDAP_PASSWORDS: alice-password,bob-password
          LDAP_GROUP: sftp-staff
        options: >-
          --health-cmd "ldapsearch -x -H ldap://localhost:1389 -b dc=example,dc=org -D cn=admin,dc=example,dc=org -w adminpassword -s base"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

      # The settings database tests (#75) run on SQLite everywhere and also against these PostgreSQL and SQL Server
      # servers on Linux (skipped elsewhere; an empty image skips the service on Windows). Each test makes its own database.
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:17.11-alpine' || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: freesftpsharp
          POSTGRES_PASSWORD: freesftpsharp-ci-only
          POSTGRES_DB: freesftpsharp
        options: >-
          --health-cmd "pg_isready -U freesftpsharp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

      sqlserver:
        image: ${{ matrix.os == 'ubuntu-latest' && 'mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04' || '' }}
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Freesftpsharp-ci-only1
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Freesftpsharp-ci-only1 -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # Locked mode fails the build if a restore would resolve other versions than packages.lock.json.
      - name: Restore
        run: dotnet restore FreeSftpSharp.sln --locked-mode

      - name: Build
        run: dotnet build FreeSftpSharp.sln --no-restore -c Release

      # Azurite (the Azure Blob emulator) for the Azure tests on Linux. It is a step and not a service container because
      # it needs a command line: --skipApiVersionCheck, as the Azure SDK is newer than every Azurite release.
      - name: Start Azurite
        if: runner.os == 'Linux'
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:10000/ && exit 0; sleep 1; done
          docker logs azurite
          exit 1

      # lftp for the FTPS end-to-end tests (#72); curl is on the runner already.
      - name: Install lftp
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Test
        env:
          FREESFTPSHARP_TEST_AZURITE: ${{ runner.os == 'Linux' && 'http://127.0.0.1:10000' || '' }}
          FREESFTPSHARP_TEST_GCS_ENDPOINT: ${{ runner.os == 'Linux' && 'http://127.0.0.1:4443' || '' }}
          FREESFTPSHARP_TEST_LDAP: ${{ runner.os == 'Linux' && '127.0.0.1:1389' || '' }}
          FREESFTPSHARP_TEST_S3_ENDPOINT: ${{ runner.os == 'Linux' && 'http://127.0.0.1:9000' || '' }}
          FREESFTPSHARP_TEST_S3_ACCESS_KEY: freesftpsharp
          FREESFTPSHARP_TEST_S3_SECRET_KEY: freesftpsharp-ci-only
          FREESFTPSHARP_TEST_POSTGRES: ${{ runner.os == 'Linux' && 'Host=127.0.0.1;Port=5432;Username=freesftpsharp;Password=freesftpsharp-ci-only;Database=freesftpsharp' || '' }}
          FREESFTPSHARP_TEST_SQLSERVER: ${{ runner.os == 'Linux' && 'Server=127.0.0.1,1433;User Id=sa;Password=Freesftpsharp-ci-only1;TrustServerCertificate=True;Encrypt=False' || '' }}
          FREESFTPSHARP_TEST_DB: ${{ matrix.db }}
        run: >-
          dotnet test FreeSftpSharp.sln --no-build -c Release
          --logger "trx;LogFilePrefix=${{ matrix.os }}${{ matrix.db }}"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}${{ matrix.db && format('-{0}', matrix.db) || '' }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

      # The package graph is the same on every OS, so the check runs once.
      # `dotnet list package --vulnerable` exits 0 even when it finds
      # vulnerable packages, so the output is parsed instead.
      - name: Check for vulnerable packages
        if: runner.os == 'Linux' && matrix.db == ''
        shell: bash
        run: |
          set -euo pipefail
          report=$(dotnet list FreeSftpSharp.sln package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if grep -q "has the following vulnerable packages" <<< "$report"; then
            echo "::error::Vulnerable NuGet packages found (see the report above)."
            exit 1
          fi
