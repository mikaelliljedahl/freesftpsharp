name: "Build and test"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    services:
      # The S3 tests (conformance suite and end-to-end) run against this MinIO on Linux and are skipped elsewhere.
      # Windows runners have no service containers: an empty image skips the service there.
      # The Bitnami image starts the MinIO server without a command (a service container cannot pass one).
      minio:
        image: ${{ matrix.os == 'ubuntu-latest' && 'bitnamilegacy/minio:2025.4.22' || '' }}
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: freesftpsharp
          MINIO_ROOT_PASSWORD: freesftpsharp-ci-only
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

      # The GCS tests (conformance suite and end-to-end) run against this fake-gcs-server on Linux and are skipped
      # elsewhere (an empty image skips the service on Windows). A service container cannot pass flags, so the
      # server is configured with its FAKE_GCS_* environment variables; the external URL is the URL of the tests.
      fake-gcs:
        image: ${{ matrix.os == 'ubuntu-latest' && 'fsouza/fake-gcs-server:1.56.1' || '' }}
        ports:
          - 4443:4443
        env:
          FAKE_GCS_SCHEME: http
          FAKE_GCS_BACKEND: memory
          FAKE_GCS_EXTERNAL_URL: http://127.0.0.1:4443

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      # Locked mode fails the build if a restore would resolve other versions than packages.lock.json.
      - name: Restore
        run: dotnet restore FreeSftpSharp.sln --locked-mode

      - name: Build
        run: dotnet build FreeSftpSharp.sln --no-restore -c Release

      # Azurite (the Azure Blob emulator) for the Azure tests on Linux. It is a step and not a service container because
      # it needs a command line: --skipApiVersionCheck, as the Azure SDK is newer than every Azurite release.
      - name: Start Azurite
        if: runner.os == 'Linux'
        run: |
          docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:10000/ && exit 0; sleep 1; done
          docker logs azurite
          exit 1

      # lftp for the FTPS end-to-end tests (#72); curl is on the runner already.
      - name: Install lftp
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Test
        env:
          FREESFTPSHARP_TEST_AZURITE: ${{ runner.os == 'Linux' && 'http://127.0.0.1:10000' || '' }}
          FREESFTPSHARP_TEST_GCS_ENDPOINT: ${{ runner.os == 'Linux' && 'http://127.0.0.1:4443' || '' }}
          FREESFTPSHARP_TEST_S3_ENDPOINT: ${{ runner.os == 'Linux' && 'http://127.0.0.1:9000' || '' }}
          FREESFTPSHARP_TEST_S3_ACCESS_KEY: freesftpsharp
          FREESFTPSHARP_TEST_S3_SECRET_KEY: freesftpsharp-ci-only
        run: >-
          dotnet test FreeSftpSharp.sln --no-build -c Release
          --logger "trx;LogFilePrefix=${{ matrix.os }}"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

      # The package graph is the same on every OS, so the check runs once.
      # `dotnet list package --vulnerable` exits 0 even when it finds
      # vulnerable packages, so the output is parsed instead.
      - name: Check for vulnerable packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          report=$(dotnet list FreeSftpSharp.sln package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if grep -q "has the following vulnerable packages" <<< "$report"; then
            echo "::error::Vulnerable NuGet packages found (see the report above)."
            exit 1
          fi
